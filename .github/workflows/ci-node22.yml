name: CI Node 22

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-node22-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    name: Check and Test (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check gates (root + package scripts)
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:check

      - name: Perf script CLI sanity (--help)
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            "scripts/perf/connect-latency.ts"
            "scripts/perf/list-sessions-roundtrip.ts"
            "scripts/perf/input-ack-roundtrip.ts"
          )

          for script in "${scripts[@]}"; do
            node --import tsx "$script" --help > /dev/null
          done

      - name: Test gates with TAP logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tap
          scripts/ci-test-all.sh artifacts/tap

      - name: Upload TAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-logs-node22-${{ github.run_id }}
          path: artifacts/tap/*.tap
          if-no-files-found: warn
          retention-days: 14

  swift-tests-macos:
    name: Swift Package Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift package/toolchain
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pkg_dir="apps/ios/M0ProtocolMockClient"

          if [ ! -f "${pkg_dir}/Package.swift" ]; then
            if [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
              echo "::error::Expected Swift package not found in ${pkg_dir} on default branch."
              exit 1
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Package.swift not found in ${pkg_dir}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! command -v swift > /dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=swift toolchain unavailable on runner" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=swift toolchain and package detected" >> "$GITHUB_OUTPUT"

      - name: Run Swift package tests
        if: steps.detect.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/ios/M0ProtocolMockClient
          swift test

      - name: Note skipped Swift tests
        if: steps.detect.outputs.should_run != 'true'
        shell: bash
        run: |
          {
            echo "### Swift package tests skipped"
            echo
            echo "${{ steps.detect.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
