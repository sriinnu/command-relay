name: CommandRelay
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
packages:
  CommandRelayKit:
    path: Packages/CommandRelayKit
targets:
  CommandRelay:
    type: application
    platform: iOS
    sources:
      - path: CommandRelayApp
        excludes:
          - "**/*.md"
    info:
      path: CommandRelayApp/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commandrelay.ios
    dependencies:
      - package: CommandRelayKit
        product: CoreKit
      - package: CommandRelayKit
        product: SessionDomainKit
